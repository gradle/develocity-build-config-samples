name: Verify Artifact Cache GitHub Actions Gradle Sample

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [ main ]
    paths: [ 'artifact-cache-github-actions-gradle/**', '.github/workflows/**', '.github/actions/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'artifact-cache-github-actions-gradle/**', '.github/workflows/**', '.github/actions/**' ]
  workflow_dispatch:

jobs:
  verification:
    name: Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifact-cache-github-actions-gradle
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify README snippet
        uses: ./.github/actions/verify-readme-snippet
        with:
          readme: artifact-cache-github-actions-gradle/README.md
          workflow: .github/workflows/artifact-cache-github-actions-gradle-verification.yml
          placeholders: |
            https://edge.example.com=https://usw2-edge.solutions-team.gradle.com
            https://develocity.example.com=https://solutions.develocity.cloud
      - name: Configure Develocity Solutions instance
        run: sed -i 's/develocity.example.com/solutions.develocity.cloud/' settings.gradle.kts
      - name: Get Develocity access token
        id: develocity-oidc
        uses: ./.github/actions/develocity-access-token
        with:
          exchange: true
      # The steps below are the README snippet, which the 'Verify README snippet' step keeps in sync
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin' # no cache input: the Artifact Cache replaces it
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: external # the Artifact Cache action caches the Gradle User Home instead
      - name: Set up Develocity Artifact Cache
        uses: gradle/develocity-artifact-cache-github-action@0366b879b8a1dce1303e672064645c5cc228e0b9 # v1.2.0
        with:
          develocity-edge-url: https://usw2-edge.solutions-team.gradle.com
          develocity-auth: workload-identity
          develocity-oidc-audience: https://solutions.develocity.cloud
          # Auto-generated image names omit the repository, so they collide across repositories on the same Edge
          image-names: |
            ${{ github.repository }}~${{ github.workflow }}~${{ github.job }}~${{ github.ref }}~${{ runner.os }}~${{ runner.arch }}
            ${{ github.repository }}~${{ github.workflow }}~${{ github.job }}~refs/heads/${{ github.base_ref || github.event.repository.default_branch }}~${{ runner.os }}~${{ runner.arch }}
      - name: Build with Gradle
        run: ./gradlew build
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.token-access-key }}
