name: Verify Artifact Cache CLI Sample

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [ main ]
    paths: [ 'artifact-cache-cli/**', 'artifact-cache-github-actions-gradle/**', 'artifact-cache-github-actions-maven/**', '.github/workflows/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'artifact-cache-cli/**', 'artifact-cache-github-actions-gradle/**', 'artifact-cache-github-actions-maven/**', '.github/workflows/**' ]
  workflow_dispatch:

jobs:
  verification:
    name: Verification with ${{ matrix.build-tool }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-tool: Gradle
            project-dir: artifact-cache-github-actions-gradle
            develocity-config: settings.gradle.kts
            build: ./gradlew build
          - build-tool: Maven
            project-dir: artifact-cache-github-actions-maven
            develocity-config: .mvn/develocity.xml
            build: ./mvnw verify -B
    env:
      DEVELOCITY_EDGE_URL: https://usw2-edge.solutions-team.gradle.com
      ARTIFACT_CACHE_PROJECT: ${{ github.repository }}
      ARTIFACT_CACHE_JOB: ${{ github.workflow }}~${{ github.job }}-${{ matrix.build-tool }}
      ARTIFACT_CACHE_BRANCH: ${{ github.head_ref || github.ref_name }}
      ARTIFACT_CACHE_BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Configure Develocity Solutions instance
        working-directory: ${{ matrix.project-dir }}
        run: sed -i 's/develocity.example.com/solutions.develocity.cloud/' ${{ matrix.develocity-config }}
      - name: Get Develocity access token
        id: develocity-oidc
        uses: ./.github/actions/develocity-access-token
        with:
          exchange: true
      - name: Get short-lived Develocity token for the Edge
        id: edge-token
        run: |
          # Exchange a GitHub OIDC token at the Edge, as the Artifact Cache action does with workload identity.
          # The script takes this token in place of the access key a CI provider without OIDC would supply.
          oidc_token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://solutions.develocity.cloud" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$oidc_token"
          token=$(curl -sSf --retry 3 -X POST -H "Authorization: Bearer $oidc_token" \
            "$DEVELOCITY_EDGE_URL/api/auth/token?expiresInHours=2")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Restore from Artifact Cache
        run: sh artifact-cache-cli/artifact-cache.sh restore --cache-metrics-file="$RUNNER_TEMP/restore-metrics.json"
        env:
          ARTIFACT_CACHE_ACCESS_KEY: ${{ steps.edge-token.outputs.token }}
      - name: Build with ${{ matrix.build-tool }}
        working-directory: ${{ matrix.project-dir }}
        run: ${{ matrix.build }}
        env:
          DEVELOCITY_ACCESS_KEY: ${{ steps.develocity-oidc.outputs.token-access-key }}
      - name: Store to Artifact Cache
        run: sh artifact-cache-cli/artifact-cache.sh store --cache-metrics-file="$RUNNER_TEMP/store-metrics.json"
        env:
          ARTIFACT_CACHE_ACCESS_KEY: ${{ steps.edge-token.outputs.token }}
      - name: Verify restore and store reached the cache
        env:
          BUILD_TOOL: ${{ matrix.build-tool }}
        run: |
          # The script never fails the build, so check the CLI's metrics: no errors, and a stored image holding content
          jq . "$RUNNER_TEMP/restore-metrics.json" "$RUNNER_TEMP/store-metrics.json"
          jq -e '.errorMessage == null and .failedImagesCount == 0' "$RUNNER_TEMP/restore-metrics.json"
          jq -e --arg tool "$BUILD_TOOL" '.errorMessage == null and .failedImagesCount == 0
            and .artifactCacheMetrics.artifactsCount > 0
            and ($tool != "Gradle" or .setupCacheMetrics.artifactsCount > 0)' "$RUNNER_TEMP/store-metrics.json"
